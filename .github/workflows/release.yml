# Release workflow — builds signed APK/AAB and creates a GitHub release with
# SLSA build provenance attestation.
#
# Setup (one-time):
#   1. Create a GitHub environment named "release" in Settings > Environments
#      - Optionally add required reviewers for manual approval before release
#      - Restrict deployments to the "v*" tag pattern (a "main" branch rule
#        would block tag-triggered runs)
#   2. Add the following secrets to the "release" environment:
#      - KEYSTORE_BASE64       : base64-encoded release keystore
#                                (generate with: base64 -w0 < release.jks)
#      - STORE_PASSWORD        : keystore password
#      - KEY_ALIAS             : signing key alias
#      - KEY_PASSWORD          : signing key password
#      Note: For PKCS12 keystores, STORE_PASSWORD and KEY_PASSWORD are the same.
#      - GOOGLE_SERVICES_JSON  : base64-encoded app/google-services.json
#                                (generate with: base64 -w0 < app/google-services.json)
#   3. Trigger by pushing a version tag: git tag v1.6.0 && git push origin v1.6.0
#      The tagged commit must have a passing CI run from a push to a branch.
#
# Verify attestation locally:
#   gh attestation verify <apk-file> --repo musicbeeremote/mbrc

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx6g\ -XX:+UseParallelGC\ -XX:MaxMetaspaceSize=1g\ -XX:+HeapDumpOnOutOfMemoryError\ -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache=true

permissions: {}

jobs:
  ci-passed:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 40); do
            RESULT=$(gh run list --repo "$REPO" --workflow CI --commit "$SHA" --event push \
              --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$RESULT" in
              "completed success") echo "CI passed for $SHA"; exit 0 ;;
              completed*) echo "CI did not pass for $SHA: $RESULT"; exit 1 ;;
            esac
            echo "CI for $SHA is ${RESULT:-not started yet}, waiting"
            sleep 60
          done
          echo "Timed out waiting for CI on $SHA"
          exit 1

  build:
    needs: ci-passed
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      apk-sha256: ${{ steps.hashes.outputs.apk-sha256 }}
      play-apk-sha256: ${{ steps.hashes.outputs.play-apk-sha256 }}
      aab-sha256: ${{ steps.hashes.outputs.aab-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Signed release artifacts must not be built from a cache that other workflows can write
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Build release artifacts
        env:
          KEYSTORE_FILE: /tmp/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease assemblePlayRelease bundlePlayRelease --no-daemon

      - name: Remove secrets
        if: always()
        run: |
          rm -f /tmp/release.jks
          rm -f app/google-services.json

      - name: Compute artifact hashes
        id: hashes
        run: |
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' -type f | head -1)
          PLAY_APK=$(find app/build/outputs/apk/play/release -name '*.apk' -type f | head -1)
          AAB=$(find app/build/outputs/bundle/playRelease -name '*.aab' -type f | head -1)
          echo "apk-sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "play-apk-sha256=$(sha256sum "$PLAY_APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "aab-sha256=$(sha256sum "$AAB" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-apk
          path: app/build/outputs/apk/github/release/*.apk

      - name: Upload Play APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-apk
          path: app/build/outputs/apk/play/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Upload Play mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-mapping
          path: app/build/outputs/mapping/playRelease/mapping.txt

  attest:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-apk
          path: artifacts/apk

      - name: Download Play APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-apk
          path: artifacts/play-apk

      - name: Download AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-aab
          path: artifacts/aab

      - name: Attest APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/apk/*.apk

      - name: Attest Play APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/play-apk/*.apk

      - name: Attest AAB
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/aab/*.aab

  release:
    needs: [build, attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-apk
          path: artifacts/apk

      - name: Download Play APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-apk
          path: artifacts/play-apk

      - name: Download AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-aab
          path: artifacts/aab

      - name: Download Play mapping
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-mapping
          path: artifacts/mapping

      - name: Compress mapping with version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/mapping/mapping.txt "artifacts/mapping/mapping-${TAG}.txt"
          (cd artifacts/mapping && zip -9 "mapping-${TAG}.zip" "mapping-${TAG}.txt")
          rm "artifacts/mapping/mapping-${TAG}.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
          PLAY_APK_SHA256: ${{ needs.build.outputs.play-apk-sha256 }}
          AAB_SHA256: ${{ needs.build.outputs.aab-sha256 }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --generate-notes \
            $PRERELEASE_FLAG \
            --notes "$(cat <<EOF
          ## Checksums

          **APK (GitHub):** \`${APK_SHA256}\`
          **APK (Play):** \`${PLAY_APK_SHA256}\`
          **AAB (Play):** \`${AAB_SHA256}\`

          ## Provenance

          Build attestations are available via \`gh attestation verify\`.
          EOF
          )" \
            artifacts/apk/*.apk \
            artifacts/play-apk/*.apk \
            artifacts/aab/*.aab \
            artifacts/mapping/mapping-*.zip
